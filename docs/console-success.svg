<svg width="920" height="360" viewBox="0 0 920 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Successful SkeletSharp console run</title>
  <desc id="desc">Terminal screenshot showing an addition example run with comments enabled and result 5.</desc>
  <rect width="920" height="360" rx="12" fill="#0d1117"/>
  <rect x="0" y="0" width="920" height="42" rx="12" fill="#161b22"/>
  <circle cx="24" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="21" r="6" fill="#27c93f"/>
  <text x="90" y="27" fill="#c9d1d9" font-family="Consolas, monospace" font-size="18">SkeletSharp - successful run</text>

  <g font-family="Consolas, monospace" font-size="18">
    <text x="26" y="74" fill="#58a6ff">PS&gt;</text>
    <text x="66" y="74" fill="#c9d1d9">dotnet run --project SkeletSharp.csproj -- addition.skl -c</text>

    <text x="26" y="114" fill="#d29922"># Function: addition left + right</text>
    <text x="26" y="140" fill="#d29922"># Inputs: left, right</text>
    <text x="26" y="166" fill="#d29922"># Output: result</text>

    <text x="26" y="206" fill="#c9d1d9">left: </text>
    <text x="88" y="206" fill="#3fb950">2</text>
    <text x="26" y="232" fill="#c9d1d9">right: </text>
    <text x="98" y="232" fill="#3fb950">3</text>
    <text x="26" y="272" fill="#c9d1d9">result: </text>
    <text x="108" y="272" fill="#3fb950">5</text>
    <text x="26" y="298" fill="#3fb950">OK</text>
    <text x="26" y="334" fill="#bc8cff">Completed in 00:00:00.0483563</text>
  </g>
</svg>
